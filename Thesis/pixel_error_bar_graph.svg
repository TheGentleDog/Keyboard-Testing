<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Bar graph of mean pixel error with standard deviation</title>
  <desc id="desc">Comparison of Mediapie with Kalman Filter and Mediapie with Kalman Filter plus EMA. Mean error decreases from 108.82 pixels to 66.96 pixels.</desc>
  <rect width="900" height="560" fill="#ffffff"/>

  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">
    Mean Pixel Error Comparison
  </text>
  <text x="450" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4b5563">
    Error bars show standard deviation in pixels
  </text>

  <!-- Plot area: left=110, top=90, right=820, bottom=420, y max=200 px -->
  <line x1="110" y1="420" x2="820" y2="420" stroke="#111827" stroke-width="2"/>
  <line x1="110" y1="90" x2="110" y2="420" stroke="#111827" stroke-width="2"/>

  <!-- Grid and y-axis labels -->
  <g font-family="Arial, sans-serif" font-size="13" fill="#374151">
    <line x1="110" y1="337.5" x2="820" y2="337.5" stroke="#e5e7eb" stroke-width="1"/>
    <line x1="110" y1="255" x2="820" y2="255" stroke="#e5e7eb" stroke-width="1"/>
    <line x1="110" y1="172.5" x2="820" y2="172.5" stroke="#e5e7eb" stroke-width="1"/>
    <line x1="110" y1="90" x2="820" y2="90" stroke="#e5e7eb" stroke-width="1"/>
    <text x="92" y="425" text-anchor="end">0</text>
    <text x="92" y="342.5" text-anchor="end">50</text>
    <text x="92" y="260" text-anchor="end">100</text>
    <text x="92" y="177.5" text-anchor="end">150</text>
    <text x="92" y="95" text-anchor="end">200</text>
  </g>

  <text x="28" y="255" transform="rotate(-90 28 255)" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#111827">
    Pixel Error (px)
  </text>

  <!-- Bars: y = 420 - value / 200 * 330 -->
  <rect x="220" y="240.45" width="130" height="179.55" fill="#2563eb"/>
  <rect x="560" y="309.52" width="130" height="110.48" fill="#16a34a"/>

  <!-- Error bars -->
  <g stroke="#111827" stroke-width="3" fill="none" stroke-linecap="round">
    <!-- Old: mean=108.82, sd=69.89, lower=38.93, upper=178.71 -->
    <line x1="285" y1="125.13" x2="285" y2="355.77"/>
    <line x1="262" y1="125.13" x2="308" y2="125.13"/>
    <line x1="262" y1="355.77" x2="308" y2="355.77"/>

    <!-- New: mean=66.96, sd=36.26, lower=30.70, upper=103.22 -->
    <line x1="625" y1="249.69" x2="625" y2="369.35"/>
    <line x1="602" y1="249.69" x2="648" y2="249.69"/>
    <line x1="602" y1="369.35" x2="648" y2="369.35"/>
  </g>

  <!-- Value labels -->
  <g font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#111827">
    <text x="285" y="229" text-anchor="middle">108.82 px</text>
    <text x="625" y="298" text-anchor="middle">66.96 px</text>
  </g>

  <!-- X labels -->
  <g font-family="Arial, sans-serif" font-size="14" fill="#111827">
    <text x="285" y="455" text-anchor="middle">
      <tspan x="285" dy="0">Mediapie with Kalman</tspan>
      <tspan x="285" dy="18">Filter</tspan>
    </text>
    <text x="625" y="455" text-anchor="middle">
      <tspan x="625" dy="0">Mediapie with Kalman</tspan>
      <tspan x="625" dy="18">Filter + EMA</tspan>
    </text>
  </g>

  <g font-family="Arial, sans-serif" font-size="14" fill="#111827">
    <rect x="616" y="98" width="18" height="18" fill="#2563eb"/>
    <text x="642" y="113">Without EMA</text>
    <rect x="616" y="126" width="18" height="18" fill="#16a34a"/>
    <text x="642" y="141">With EMA</text>
  </g>

  <text x="450" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#374151">
    Mean error improved by 38.47% after adding EMA.
  </text>
</svg>
