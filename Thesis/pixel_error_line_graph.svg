<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Line graph of mean pixel error</title>
  <desc id="desc">Mean pixel error decreases from 108.82 pixels with Kalman Filter to 66.96 pixels with Kalman Filter plus EMA.</desc>
  <rect width="900" height="560" fill="#ffffff"/>

  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">
    Mean Pixel Error Trend
  </text>
  <text x="450" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4b5563">
    Lower mean error indicates better gaze-point accuracy
  </text>

  <!-- Plot area: left=110, top=90, right=820, bottom=420, y max=120 px -->
  <line x1="110" y1="420" x2="820" y2="420" stroke="#111827" stroke-width="2"/>
  <line x1="110" y1="90" x2="110" y2="420" stroke="#111827" stroke-width="2"/>

  <!-- Grid and y-axis labels -->
  <g font-family="Arial, sans-serif" font-size="13" fill="#374151">
    <line x1="110" y1="365" x2="820" y2="365" stroke="#e5e7eb" stroke-width="1"/>
    <line x1="110" y1="310" x2="820" y2="310" stroke="#e5e7eb" stroke-width="1"/>
    <line x1="110" y1="255" x2="820" y2="255" stroke="#e5e7eb" stroke-width="1"/>
    <line x1="110" y1="200" x2="820" y2="200" stroke="#e5e7eb" stroke-width="1"/>
    <line x1="110" y1="145" x2="820" y2="145" stroke="#e5e7eb" stroke-width="1"/>
    <line x1="110" y1="90" x2="820" y2="90" stroke="#e5e7eb" stroke-width="1"/>
    <text x="92" y="425" text-anchor="end">0</text>
    <text x="92" y="370" text-anchor="end">20</text>
    <text x="92" y="315" text-anchor="end">40</text>
    <text x="92" y="260" text-anchor="end">60</text>
    <text x="92" y="205" text-anchor="end">80</text>
    <text x="92" y="150" text-anchor="end">100</text>
    <text x="92" y="95" text-anchor="end">120</text>
  </g>

  <text x="28" y="255" transform="rotate(-90 28 255)" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#111827">
    Mean Error (px)
  </text>

  <!-- Points: old=(285,120.75), new=(625,235.86) -->
  <polyline points="285,120.75 625,235.86" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#ffffff" stroke="#dc2626" stroke-width="5">
    <circle cx="285" cy="120.75" r="9"/>
    <circle cx="625" cy="235.86" r="9"/>
  </g>

  <!-- Value labels -->
  <g font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#111827">
    <text x="285" y="100" text-anchor="middle">108.82 px</text>
    <text x="625" y="216" text-anchor="middle">66.96 px</text>
  </g>

  <!-- Change annotation -->
  <g font-family="Arial, sans-serif" font-size="15" fill="#111827">
    <line x1="425" y1="155" x2="506" y2="198" stroke="#6b7280" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="466" y="146" text-anchor="middle" font-weight="700" fill="#16a34a">38.47% improvement</text>
  </g>

  <!-- X labels -->
  <g font-family="Arial, sans-serif" font-size="14" fill="#111827">
    <text x="285" y="455" text-anchor="middle">
      <tspan x="285" dy="0">Mediapie with Kalman</tspan>
      <tspan x="285" dy="18">Filter</tspan>
    </text>
    <text x="625" y="455" text-anchor="middle">
      <tspan x="625" dy="0">Mediapie with Kalman</tspan>
      <tspan x="625" dy="18">Filter + EMA</tspan>
    </text>
  </g>

  <text x="450" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#374151">
    Based on 9 tests per condition.
  </text>
</svg>
